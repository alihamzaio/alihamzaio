<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="Ali Hamza  Full Stack Developer terminal animation">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="28" y="58" width="804" height="190" rx="8"/>
    </clipPath>
  </defs>

  <rect width="860" height="280" rx="16" fill="url(#bg)"/>
  <rect x="16" y="16" width="828" height="248" rx="12" fill="#020617" stroke="#1e293b" stroke-width="2"/>

  <!-- title bar -->
  <rect x="16" y="16" width="828" height="36" rx="12" fill="#0f172a"/>
  <rect x="16" y="40" width="828" height="12" fill="#0f172a"/>
  <circle cx="40" cy="34" r="6" fill="#f87171"/>
  <circle cx="60" cy="34" r="6" fill="#fbbf24"/>
  <circle cx="80" cy="34" r="6" fill="#4ade80"/>
  <text x="430" y="39" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">alihamzaio  full-stack.dev</text>

  <g clip-path="url(#screen)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="40" y="84" fill="#64748b">~/work</text>
    <text x="100" y="84" fill="#38bdf8">o</text>
    <text x="120" y="84" fill="#e2e8f0">whoami</text>

    <text x="40" y="112" fill="url(#accent)" font-weight="700">Ali Hamza · Full Stack Developer</text>

    <text x="40" y="144" fill="#64748b">~/work</text>
    <text x="100" y="144" fill="#38bdf8">o</text>
    <text x="120" y="144" fill="#e2e8f0">stack --summary</text>

    <text x="40" y="172" fill="#94a3b8">React · Next.js · Node.js · AWS · MongoDB · Web3</text>

    <text x="40" y="204" fill="#64748b">~/work</text>
    <text x="100" y="204" fill="#38bdf8">o</text>
    <text x="120" y="204" fill="#e2e8f0">status</text>

    <text x="40" y="232" fill="#34d399">Available for remote full-time &amp; contract roles</text>

    <!-- blinking cursor -->
    <rect x="470" y="218" width="10" height="18" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle scan highlight -->
    <rect x="28" y="58" width="804" height="28" fill="#38bdf8" opacity="0.04">
      <animate attributeName="y" values="58;220;58" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
